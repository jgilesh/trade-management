<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Trade Management — demystified</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#F5F0E8; font-family:system-ui,-apple-system,sans-serif; color:#1a1108; min-height:100vh; }
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideIn { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }
.fu { animation:fadeUp 0.3s ease forwards; }
.si { animation:slideIn 0.25s ease forwards; }
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#C4A460;border-radius:3px}
@media (max-width:620px){ .g2 { grid-template-columns:1fr !important; } .g3 { grid-template-columns:1fr !important; } .g5 { grid-template-columns:1fr 1fr !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const OR="#F5853F",RD="#D94F2A",GR="#0D9E6E",GD="#C4A460",PU="#7C5CBF",BL="#2A7ED4",DK="#1a1108",CA="#fffcf7",BD="#e8ddd0";

// ── Resource links ────────────────────────────────────────────
const LINK = {
  planning: "https://tradeplanning.vercel.app/",
  ta:       "https://technical-analysis-mu.vercel.app/",
  chain:    "https://options-chain-decoder.vercel.app/",
  checklist:"https://pre-trade-checklist.vercel.app/",
  planner:  "https://kajabi-communities-documents.s3.us-west-2.amazonaws.com/b0f3bd36-41da-46bb-bd7b-634990968879",
  journal:  "https://kajabi-communities-documents.s3.us-west-2.amazonaws.com/9b87ea67-d0b1-4f1e-bcfc-4d3763f2d2c1",   // Dominique's Trading Journal (shared with the community)
  risk:     null,   // Risk Management module — coming soon
};

// ── Companion resources (plan → live chart → journal) ─────────
const TOOLS = [
  {icon:"📝",label:"Trade Planner",url:LINK.planner,note:"The plan you wrote before entry. Every decision in this module points back to it."},
  {icon:"📊",label:"Technical Analysis",url:LINK.ta,note:"Module: the live chart. Trend, levels, and structure you are observing against the plan."},
  {icon:"📓",label:"Trading Journal",url:LINK.journal,note:"Dominique's journal, shared with the community. Where the result gets recorded."},
  {icon:"🧭",label:"Trade Planning",url:LINK.planning,note:"Module 5: how the plan was built. Revisit it if your plan is missing a condition."},
  {icon:"⛓️",label:"The Options Chain",url:LINK.chain,note:"Module: contract mechanics. Reference it, do not relearn it here."},
  {icon:"🛡️",label:"Risk Management",url:LINK.risk,note:"Module: position sizing and max loss. Coming soon.",soon:true},
];

// ── Management paths (the field guide) ────────────────────────
const PATHS = [
  {tab:1,icon:"📈",label:"Manage a Winner",color:GR,cond:"Price moved in your favor",q:"Has a profit‑management condition from my plan occurred?"},
  {tab:2,icon:"📉",label:"Manage a Loser",color:RD,cond:"Price moved against you",q:"Has my predefined invalidation condition occurred?"},
  {tab:3,icon:"⏸️",label:"Stay With the Trade",color:BL,cond:"Neither condition has occurred",q:"Is there anything in my plan that tells me to act right now?"},
];

// ═══════════════════════════════════════════════════════════════
// SHARED COMPONENTS (module level — never inside App)
// ═══════════════════════════════════════════════════════════════
function NextBtn({label,onClick}){return(<button onClick={onClick} style={{background:OR,border:"none",borderRadius:"999px",padding:"10px 26px",color:"#fff",fontWeight:"700",fontSize:"0.82rem",letterSpacing:"0.06em",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px",margin:"20px auto 0"}}>{label} →</button>);}

function RuleBox({rule,color}){return(<div style={{background:"linear-gradient(130deg,#1a1108,#2c1d0e)",borderRadius:"8px",padding:"11px 13px",marginBottom:"10px",borderLeft:"3px solid "+(color||OR)}}><div style={{fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.12em",textTransform:"uppercase",color:"#9a7a55",marginBottom:"6px"}}>⚡ The Rule</div><div style={{fontSize:"0.78rem",lineHeight:"1.65",color:"#e8ddd0"}}>{rule}</div></div>);}

function SectionLabel({label,sub,color}){return(<div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"12px",paddingBottom:"8px",borderBottom:"2px solid #e8ddd033"}}><div style={{width:"3px",height:"22px",background:color||OR,borderRadius:"2px"}}/><div><div style={{fontWeight:"700",fontSize:"0.88rem",color:DK}}>{label}</div>{sub&&<div style={{fontSize:"0.72rem",color:"#8a7560"}}>{sub}</div>}</div></div>);}

function InfoBox({icon,label,bg,dark,green,italic,mt,children}){
  return(
    <div style={{background:bg||"#f7f0e6",borderRadius:"8px",padding:"11px 13px",marginTop:mt?"10px":"0"}}>
      <div style={{fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.12em",textTransform:"uppercase",color:dark?"#9a7a55":green?"#065f46":"#8a7560",marginBottom:"6px"}}>{icon} {label}</div>
      <div style={{fontSize:"0.8rem",lineHeight:"1.65",color:dark?"#e8ddd0":green?"#052e16":"#3d2e1e",fontStyle:italic?"italic":"normal"}}>{children}</div>
    </div>
  );
}

function GreenRed({green,red,greenLabel,redLabel}){return(<div className="g2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginTop:"10px"}}><div style={{background:"#e8faf3",borderRadius:"8px",padding:"10px 12px"}}><div style={{fontSize:"0.6rem",fontWeight:"700",letterSpacing:"0.1em",textTransform:"uppercase",color:GR,marginBottom:"6px"}}>✅ {greenLabel||"Green flags"}</div>{green.map((g,i)=>(<div key={i} style={{display:"flex",gap:"6px",marginBottom:"4px"}}><div style={{width:"5px",height:"5px",borderRadius:"50%",background:GR,marginTop:"5px",flexShrink:0}}/><div style={{fontSize:"0.72rem",color:"#052e16",lineHeight:"1.5"}}>{g}</div></div>))}</div><div style={{background:"#fff0ee",borderRadius:"8px",padding:"10px 12px"}}><div style={{fontSize:"0.6rem",fontWeight:"700",letterSpacing:"0.1em",textTransform:"uppercase",color:RD,marginBottom:"6px"}}>🚩 {redLabel||"Red flags"}</div>{red.map((r,i)=>(<div key={i} style={{display:"flex",gap:"6px",marginBottom:"4px"}}><div style={{width:"5px",height:"5px",borderRadius:"50%",background:RD,marginTop:"5px",flexShrink:0}}/><div style={{fontSize:"0.72rem",color:"#5a1a1a",lineHeight:"1.5"}}>{r}</div></div>))}</div></div>);}

function InfoCard({icon,title,color,children}){return(<div style={{background:CA,border:"1px solid "+BD,borderRadius:"12px",padding:"14px 16px",borderLeft:"4px solid "+color}}><div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"8px"}}><span style={{fontSize:"1.1rem"}}>{icon}</span><span style={{fontWeight:"700",fontSize:"0.82rem",color:DK}}>{title}</span></div><div style={{fontSize:"0.78rem",color:"#5a4535",lineHeight:"1.6"}}>{children}</div></div>);}

// ── QDA — dark tab opener ─────────────────────────────────────
function QDA({question,options,action,color}){
  const c = color||OR;
  return(
    <div style={{background:"linear-gradient(130deg,#1a1108,#2c1d0e)",borderRadius:"12px",padding:"18px 20px",marginBottom:"16px"}}>
      <div style={{fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.15em",textTransform:"uppercase",color:"#9a7a55",marginBottom:"7px"}}>❓ The Question</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"1.15rem",color:"#fff",lineHeight:"1.4",marginBottom:"13px"}}>{question}</div>
      <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"13px",flexWrap:"wrap"}}>
        <span style={{fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.15em",textTransform:"uppercase",color:"#9a7a55",flexShrink:0}}>⚖️ Decision</span>
        <div style={{display:"flex",gap:"7px",alignItems:"center",flexWrap:"wrap"}}>
          {options.map((o,i)=>(
            <span key={o} style={{display:"inline-block",padding:"4px 13px",borderRadius:"999px",background:i===0?c:"rgba(255,255,255,0.08)",border:"1px solid "+(i===0?c:"rgba(255,255,255,0.16)"),color:i===0?"#fff":"#d4a87a",fontSize:"0.72rem",fontWeight:"700",letterSpacing:"0.04em"}}>{o}</span>
          ))}
        </div>
      </div>
      <div style={{borderTop:"1px solid rgba(255,255,255,0.09)",paddingTop:"12px"}}>
        <div style={{fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.15em",textTransform:"uppercase",color:"#9a7a55",marginBottom:"6px"}}>✅ The Action</div>
        <div style={{fontSize:"0.83rem",color:"#e8ddd0",lineHeight:"1.65"}}>{action}</div>
      </div>
    </div>
  );
}

// ── Ask yourself, with both outcomes ──────────────────────────
function AskYourself({question,no,yes,color,noLabel,yesLabel}){
  const c = color||OR;
  return(
    <div style={{background:CA,border:"1px solid "+BD,borderLeft:"4px solid "+c,borderRadius:"12px",padding:"16px 18px",margin:"18px 0 0"}}>
      <div style={{display:"flex",gap:"13px",alignItems:"flex-start",marginBottom:"12px"}}>
        <div style={{fontSize:"1.3rem",flexShrink:0,lineHeight:"1.3"}}>🤔</div>
        <div>
          <div style={{fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.14em",textTransform:"uppercase",color:"#8a7560",marginBottom:"6px"}}>Ask Yourself</div>
          <div style={{fontFamily:"Georgia,serif",fontStyle:"italic",fontSize:"1rem",color:DK,lineHeight:"1.55"}}>"{question}"</div>
        </div>
      </div>
      <div style={{display:"grid",gap:"7px"}}>
        <div style={{display:"flex",gap:"9px",alignItems:"flex-start",background:"#fff0ee",borderRadius:"8px",padding:"9px 12px"}}>
          <span style={{fontSize:"0.72rem",fontWeight:"700",color:RD,flexShrink:0,minWidth:"26px"}}>{noLabel||"No"}</span>
          <span style={{fontSize:"0.78rem",color:"#5a1a1a",lineHeight:"1.55"}}>{no}</span>
        </div>
        <div style={{display:"flex",gap:"9px",alignItems:"flex-start",background:"#e8faf3",borderRadius:"8px",padding:"9px 12px"}}>
          <span style={{fontSize:"0.72rem",fontWeight:"700",color:GR,flexShrink:0,minWidth:"26px"}}>{yesLabel||"Yes"}</span>
          <span style={{fontSize:"0.78rem",color:"#052e16",lineHeight:"1.55"}}>{yes}</span>
        </div>
      </div>
    </div>
  );
}

// ── Expandable card ───────────────────────────────────────────
function ExpandableCard({accent,icon,title,shortDesc,isOpen,onToggle,children}){
  return(
    <div style={{border:"1px solid "+(isOpen?accent:BD),borderRadius:"12px",overflow:"hidden",marginBottom:"8px",background:CA}}>
      <div onClick={onToggle} style={{display:"flex",alignItems:"center",gap:"12px",padding:"14px 16px",cursor:"pointer",borderLeft:"4px solid "+accent,background:CA,transition:"background 0.15s"}}>
        <span style={{fontSize:"1.2rem",flexShrink:0}}>{icon}</span>
        <div style={{flex:1}}>
          <div style={{fontWeight:"700",fontSize:"0.9rem",color:DK,marginBottom:"2px"}}>{title}</div>
          <div style={{fontSize:"0.75rem",color:"#8a7560",lineHeight:"1.4"}}>{shortDesc}</div>
        </div>
        <span style={{color:"#8a7560",fontSize:"13px",flexShrink:0,transition:"transform 0.2s",transform:isOpen?"rotate(180deg)":"rotate(0deg)"}}>▼</span>
      </div>
      {isOpen&&(
        <div className="fu" style={{borderTop:"1px solid "+BD,borderLeft:"4px solid "+accent,background:CA}}>
          {children}
        </div>
      )}
    </div>
  );
}

// ── Two-column body for an expandable card ────────────────────
// what / why / analogy on the left; rule / example on the right
function Concept({what,why,analogy,rule,example,color,extra}){
  return(
    <div>
      <div className="g2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0"}}>
        <div style={{padding:"14px 16px",borderRight:"1px solid "+BD}}>
          <InfoBox icon="📌" label="What it is" bg="#f7f0e6">{what}</InfoBox>
          <InfoBox icon="🎯" label="Why it matters" bg="#fff4eb" mt>{why}</InfoBox>
          {analogy&&<InfoBox icon="💡" label="Think of it like" bg="#f7f0e6" italic mt>{analogy}</InfoBox>}
        </div>
        <div style={{padding:"14px 16px"}}>
          <RuleBox rule={rule} color={color}/>
          <InfoBox icon="🧮" label="Example" bg="#e8faf3" green>{example}</InfoBox>
        </div>
      </div>
      {extra&&<div style={{padding:"0 16px 14px"}}>{extra}</div>}
    </div>
  );
}

// ── Resource pills ────────────────────────────────────────────
function Resources({items,title}){
  return(
    <div style={{background:CA,border:"1px solid "+BD,borderRadius:"12px",padding:"14px 16px",marginTop:"16px"}}>
      <div style={{fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.14em",textTransform:"uppercase",color:"#8a7560",marginBottom:"10px"}}>🔗 {title||"Companion resources"}</div>
      <div style={{display:"grid",gap:"9px"}}>
        {items.map(it=>(
          <div key={it.label} style={{display:"flex",alignItems:"center",gap:"12px",flexWrap:"wrap"}}>
            {it.url?(
              <a href={it.url} target="_blank" rel="noopener noreferrer"
                style={{display:"inline-flex",alignItems:"center",gap:"7px",background:"#f7f0e6",border:"1px solid "+BD,borderRadius:"999px",padding:"7px 15px",textDecoration:"none",color:DK,fontSize:"0.76rem",fontWeight:"700",transition:"all 0.15s",flexShrink:0,whiteSpace:"nowrap"}}
                onMouseOver={e=>{e.currentTarget.style.borderColor=OR;e.currentTarget.style.color=OR;}}
                onMouseOut={e=>{e.currentTarget.style.borderColor=BD;e.currentTarget.style.color=DK;}}>
                <span>{it.icon}</span>{it.label}<span style={{color:"#b0a090",fontSize:"0.7rem"}}>↗</span>
              </a>
            ):(
              <span style={{display:"inline-flex",alignItems:"center",gap:"7px",background:"#f0e8da",border:"1px dashed "+BD,borderRadius:"999px",padding:"7px 15px",color:"#8a7560",fontSize:"0.76rem",fontWeight:"700",flexShrink:0,whiteSpace:"nowrap"}}>
                <span>{it.icon}</span>{it.label}<span style={{fontSize:"0.6rem",letterSpacing:"0.08em",textTransform:"uppercase",color:"#b0a090"}}>soon</span>
              </span>
            )}
            <span style={{fontSize:"0.75rem",color:"#8a7560",lineHeight:"1.5",flex:1,minWidth:"160px"}}>{it.note}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Path switcher — jump between management paths ─────────────
function PathSwitch({current,goTab}){
  const others = PATHS.filter(p=>p.tab!==current);
  return(
    <div style={{marginTop:"18px",background:"#f0e8da",border:"1px solid "+BD,borderRadius:"12px",padding:"12px 14px"}}>
      <div style={{fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.14em",textTransform:"uppercase",color:"#8a7560",marginBottom:"8px"}}>🧭 Condition changed? Switch paths</div>
      <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
        {others.map(p=>(
          <button key={p.tab} onClick={()=>goTab(p.tab)}
            style={{display:"inline-flex",alignItems:"center",gap:"7px",background:CA,border:"1px solid "+BD,borderLeft:"3px solid "+p.color,borderRadius:"999px",padding:"7px 14px",cursor:"pointer",color:DK,fontSize:"0.74rem",fontWeight:"700"}}>
            <span>{p.icon}</span>{p.label}
          </button>
        ))}
        <button onClick={()=>goTab(4)}
          style={{display:"inline-flex",alignItems:"center",gap:"7px",background:CA,border:"1px solid "+BD,borderLeft:"3px solid "+OR,borderRadius:"999px",padding:"7px 14px",cursor:"pointer",color:DK,fontSize:"0.74rem",fontWeight:"700"}}>
          <span>✅</span>Execute &amp; Evaluate
        </button>
      </div>
    </div>
  );
}

// ── Numbered step card (Execute tab) ──────────────────────────
function StepCard({step,title,color,children}){
  const c=color||OR;
  return(
    <div style={{background:CA,border:"1px solid "+BD,borderLeft:"4px solid "+c,borderRadius:"12px",padding:"16px 18px",marginBottom:"14px"}}>
      <div style={{display:"flex",alignItems:"center",gap:"9px",marginBottom:"9px",flexWrap:"wrap"}}>
        <span style={{display:"inline-block",padding:"3px 10px",borderRadius:"999px",background:c+"18",color:c,fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.1em",textTransform:"uppercase"}}>{step}</span>
        <span style={{fontFamily:"Georgia,serif",fontSize:"1.05rem",fontWeight:"700",color:DK}}>{title}</span>
      </div>
      <div style={{fontSize:"0.83rem",color:"#3d2e1e",lineHeight:"1.7"}}>{children}</div>
    </div>
  );
}

function LinkBtn({label,url,color}){
  if(!url) return(<span style={{display:"inline-flex",alignItems:"center",gap:"7px",background:"#f0e8da",border:"1px dashed "+BD,borderRadius:"999px",padding:"9px 20px",color:"#8a7560",fontSize:"0.78rem",fontWeight:"700",marginTop:"4px"}}>{label} <span style={{fontSize:"0.6rem",letterSpacing:"0.08em",textTransform:"uppercase"}}>soon</span></span>);
  return(
    <a href={url} target="_blank" rel="noopener noreferrer"
      style={{display:"inline-flex",alignItems:"center",gap:"7px",background:color||PU,borderRadius:"999px",padding:"9px 20px",textDecoration:"none",color:"#fff",fontSize:"0.78rem",fontWeight:"700",letterSpacing:"0.04em",marginTop:"4px"}}>
      {label} <span style={{fontSize:"0.72rem"}}>↗</span>
    </a>
  );
}

// ── Closing bridge: the loop starts again at the plan ─────────
function ChecklistBridge(){
  return(
    <div style={{marginTop:"20px",background:"linear-gradient(130deg,#1a1108,#2c1d0e)",borderRadius:"14px",padding:"20px 22px",display:"flex",alignItems:"center",gap:"16px",flexWrap:"wrap"}}>
      <div style={{fontSize:"1.8rem",flexShrink:0}}>📋</div>
      <div style={{flex:1,minWidth:"200px"}}>
        <div style={{fontSize:"0.65rem",fontWeight:"700",letterSpacing:"0.15em",textTransform:"uppercase",color:"#9a7a55",marginBottom:"5px"}}>The loop closes where it began</div>
        <div style={{fontFamily:"Georgia,serif",fontSize:"1rem",color:"#fff",marginBottom:"5px"}}>Your next trade starts with the Pre-Trade Checklist and a written plan.</div>
        <div style={{fontSize:"0.78rem",color:"#d4a87a",lineHeight:"1.55"}}>Carry any change you're testing into the next plan. Then manage the trade according to that plan.</div>
      </div>
      <div style={{display:"flex",gap:"8px",flexWrap:"wrap",flexShrink:0}}>
        <a href={LINK.checklist} target="_blank" rel="noopener noreferrer"
          style={{background:OR,borderRadius:"999px",padding:"10px 22px",fontWeight:"700",fontSize:"0.8rem",color:"#fff",letterSpacing:"0.06em",whiteSpace:"nowrap",textDecoration:"none",display:"inline-block"}}>
          Open Checklist →
        </a>
        <a href={LINK.planning} target="_blank" rel="noopener noreferrer"
          style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.14)",borderRadius:"999px",padding:"10px 22px",fontWeight:"700",fontSize:"0.8rem",color:"#d4a87a",letterSpacing:"0.06em",whiteSpace:"nowrap",textDecoration:"none",display:"inline-block"}}>
          Trade Planning →
        </a>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// TAB 1 — MANAGE THE POSITION (the process)
// ═══════════════════════════════════════════════════════════════
const PROCESS_CARDS = [
  {
    id:"plan", icon:"🗺️", color:OR, title:"Plan vs. live price",
    short:"The only comparison that matters once you are in the trade.",
    what:"Trade management is the act of holding your Module 5 plan next to the live chart and asking one question: which of my predefined conditions is happening right now?",
    why:"Without the plan, every candle becomes a new decision. With it, price movement is just information that maps to a response you already chose.",
    analogy:"A pilot flying a route does not decide where to go each time the wind shifts. The flight plan is filed before takeoff. In the air, the job is to compare position to plan and make the corrections the plan already allows for.",
    rule:"Manage the live trade against the written plan. Ask: what is price doing relative to the conditions I defined before entry?",
    example:"Your plan says to take profit if the stock reaches $54 and exit if it closes below $48.50. The stock is now $51.20. Neither condition has occurred, so there is nothing to execute. Continue managing the trade according to the plan."
  },
  {
    id:"conditions", icon:"🚦", color:GR, title:"Hold / exit conditions",
    short:"Sort the live trade into one of three management paths.",
    what:"Before entry, your plan defined the conditions that would cause you to manage a winner or exit a loser. If neither condition has occurred, you hold. That gives every live trade one of three management paths: Winner, Loser, or Hold.",
    why:"Without predefined conditions, every price move can feel like a new decision. Sorting the trade into one of three management paths keeps you responding to the plan instead of reacting to every candle.",
    analogy:"A thermostat has a target and a tolerance. Above the range, the AC turns on. Below, the heat turns on. Inside the range, it does nothing, and it is not confused about doing nothing.",
    rule:"Identify which management path applies before you act: Winner, Loser, or Hold. If no predefined condition has occurred, there is nothing to execute.",
    example:"Your plan says to take partial profit if the stock reaches $54 and exit if it closes below $48.50. The stock is at $51.80. Neither condition has occurred, so you hold. Later, the stock reaches $54. A profit‑management condition has now occurred, so you move to Manage a Winner."
  },
  {
    id:"consistent", icon:"🔁", color:BL, title:"Consistent execution",
    short:"Do the same thing every time, so the results can teach you something.",
    what:"Consistency means responding to the same condition the same way, trade after trade—even when a particular trade tempts you to do otherwise.",
    why:"A single trade can win for the wrong reason or lose for the right one. Only a consistent process produces results you can meaningfully evaluate. Inconsistent execution makes every result harder to interpret.",
    analogy:"A recipe tested with a different oven temperature every time never tells you whether the recipe works. Hold the temperature steady, and the results start to mean something.",
    rule:"Execute the management conditions in your plan consistently from trade to trade. Don't change the rule because of what happened on the last trade.",
    example:"Your plan says to exit when the stock closes below your invalidation level. On one trade, that condition occurs—but you decide to wait another day. The stock recovers. You made money, but you did not follow the process. Record the deviation rather than treating the outcome as evidence that waiting works."
  },
  {
    id:"journal", icon:"📓", color:PU, title:"Trade journaling",
    short:"A record turns individual trades into usable data.",
    what:"The Trade Journal records what happened in the trade and gives you space to capture useful information about how you managed it: your plan, execution, result, and observations. That record connects what happened in this trade to what you can learn from it.",
    why:"A journal gives you a record of what actually happened so you can review your trading process over time rather than relying on memory.",

        options={["Nothing","Something"]}
        action="Managing a position does not mean acting on it. If no written condition has occurred, your job is to keep observing the trade against the plan on the planned timeframe. The plan is still in force. Let it work."
        color={BL}
      />

      <div className="g3" style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"10px",marginBottom:"18px"}}>
        {[
          {n:"1",color:BL,title:"Open the chart",desc:"Check the chart on the timeframe defined in your plan—not whenever you feel the urge to look."},
          {n:"2",color:BL,title:"Compare to the plan",desc:"Profit‑management condition occurred? Invalidation condition occurred? Compare the chart with the conditions in your plan."},
          {n:"3",color:BL,title:"Close the platform",desc:"If every answer is no, the check is over. There is nothing to do until the next one."},
        ].map(s=>(
          <div key={s.n} style={{background:CA,border:"1px solid "+BD,borderRadius:"10px",padding:"14px",borderTop:"3px solid "+s.color}}>
            <div style={{width:"24px",height:"24px",borderRadius:"50%",background:s.color,color:"#fff",fontWeight:"700",fontSize:"0.78rem",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:"8px"}}>{s.n}</div>
            <div style={{fontWeight:"700",fontSize:"0.82rem",color:DK,marginBottom:"4px"}}>{s.title}</div>
            <div style={{fontSize:"0.72rem",color:"#5a4535",lineHeight:"1.5"}}>{s.desc}</div>
          </div>
        ))}
      </div>

      <SectionLabel label="Holding well" sub="Five practices for managing a trade when no action is required. Tap to expand." color={BL}/>
      {STAY_CARDS.map(c=>(
        <ExpandableCard key={c.id} accent={c.color} icon={c.icon} title={c.title} shortDesc={c.short}
          isOpen={open===c.id} onToggle={()=>setOpen(open===c.id?null:c.id)}>
          <Concept what={c.what} why={c.why} analogy={c.analogy} rule={c.rule} example={c.example} color={c.color}/>
        </ExpandableCard>
      ))}

      <div style={{marginTop:"18px",background:CA,border:"1px solid "+BD,borderRadius:"14px",overflow:"hidden"}}>
        <div style={{background:"#f0e8da",padding:"12px 16px",borderBottom:"1px solid "+BD}}>
          <div style={{fontWeight:"700",fontSize:"0.82rem",color:DK}}>📋 The urge, the chart, and the plan</div>
          <div style={{fontSize:"0.72rem",color:"#8a7560",marginTop:"2px"}}>Common hold‑state urges and what to do with them.</div>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:"560px"}}>
            <thead><tr style={{background:"#faf6ef"}}>
              {["What you feel","What the chart says","What you do"].map(h=>(
                <th key={h} style={{textAlign:"left",padding:"10px 14px",fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.1em",textTransform:"uppercase",color:"#8a7560",borderBottom:"1px solid "+BD}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {[
                ["\"It's up, I should lock it in\"","Target not hit, trail not triggered","Hold. Journal the urge."],
                ["\"It's down, I should get out\"","Above invalidation, thesis intact","Hold. Check again at the next scheduled close."],
                ["\"It's flat, I should add\"","No condition in the plan says add","Hold. Adding is a new trade with a new plan."],
                ["\"I should tighten my stop\"","A new higher low has formed","Check the plan. Adjust only if your management rule calls for it."],
                ["\"I should give it more room\"","Price is near invalidation","Follow the condition already defined in the plan. Do not change it simply to avoid an exit."],
                ["\"Let me check a faster chart\"","Plan was built on the daily","Stay on the planned timeframe. The faster chart is not part of this trade's decision framework."],
              ].map((r,i)=>(
                <tr key={i} style={{borderBottom:"1px solid "+BD}}>
                  {r.map((c,j)=>(<td key={j} style={{padding:"10px 14px",fontSize:"0.76rem",color:j===0?DK:"#5a4535",fontStyle:j===0?"italic":"normal",lineHeight:"1.5"}}>{c}</td>))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <PathSwitch current={3} goTab={goTab}/>
      <Resources items={TOOLS.filter(t=>["Trade Planner","Technical Analysis","Trading Journal"].includes(t.label))}/>
      <NextBtn label="Execute & Evaluate" onClick={()=>goTab(4)}/>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// TAB 5 — EXECUTE & EVALUATE
// ═══════════════════════════════════════════════════════════════
function TabExecute({goTab}){
  return(
    <div className="fu">
      <QDA
        question="A condition from my plan has occurred. Now what?"
        options={["Execute","Hesitate"]}
        action="Do what the plan says when the predefined condition occurs. Then record what happened. Only after a body of trades, evaluate the results for a pattern and decide whether anything needs to change. This is the loop that turns trading into a process."
        color={OR}
      />

      <StepCard step="Step 1" title="Execute the plan" color={GR}>
        When the profit‑management condition or the invalidation condition occurs, the decision is already made. Place the order. Execution is simply carrying out the response you defined before the trade.
        <RuleBox color={GR} rule="When the predefined condition occurs, execute the response written in your plan. Do not wait for additional confirmation or change the condition in the moment."/>
        <InfoBox icon="🧮" label="Example" bg="#e8faf3" green>
          Target was a contract price of $2.60. The contract reaches the target, and you exit as planned: $130 profit per contract. The stock runs another $2 the next day. You did not miss anything. That was not your trade, and the journal will show a plan executed cleanly.
        </InfoBox>
      </StepCard>

      <StepCard step="Step 2" title="Record the trade" color={PU}>
        Log it the same day, before you look for the next setup. The record is the raw material for everything that follows.
        <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginTop:"12px"}}>
          <LinkBtn label="📓 Open the Trade Journal" url={LINK.journal}/>
        </div>
      </StepCard>

      <StepCard step="Step 3" title="Review execution, not just results" color={BL}>
        Every trade lands in one of four boxes. Evaluate the financial outcome and the execution separately. A losing trade can still reflect planned execution, while a profitable trade can result from execution outside the plan.
        <div style={{overflowX:"auto",marginTop:"12px"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:"420px"}}>
            <thead><tr style={{background:"#faf6ef"}}>
              {["","Followed the plan","Did not follow the plan"].map((h,i)=>(
                <th key={i} style={{textAlign:"left",padding:"9px 12px",fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.1em",textTransform:"uppercase",color:"#8a7560",border:"1px solid "+BD}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {[
                ["Profitable trade","Planned execution + profitable outcome","Unplanned execution + profitable outcome"],
                ["Losing trade","Planned execution + losing outcome","Unplanned execution + losing outcome"],
              ].map((r,i)=>(
                <tr key={i}>
                  {r.map((c,j)=>(<td key={j} style={{padding:"9px 12px",fontSize:"0.76rem",color:j===0?DK:"#5a4535",fontWeight:j===0?"700":"400",lineHeight:"1.5",border:"1px solid "+BD,background:j===0?"#faf6ef":(j===1?"#e8faf3":"#fff0ee")}}>{c}</td>))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{marginTop:"10px"}}>The financial result tells you what happened to the trade. The execution result tells you whether you managed it according to plan. Keep those two evaluations separate.</div>
      </StepCard>

      <StepCard step="Step 4" title="Evaluate the sample" color={GD}>
        One trade tells you almost nothing. A set of trades managed the same way gives you something to evaluate. Before you change any rule, sit down with the journal and look across the whole body of results for patterns that repeat.
        <RuleBox color={GD} rule="Review a sample of comparable trades executed under the same rules. Look for patterns that repeat across the sample, and separate the performance of the plan from how consistently you followed it."/>
        <InfoBox icon="🔍" label="What to look for" bg="#f7f0e6">
          Losers that were exited late, repeatedly. Winners cut well short of the target, repeatedly. Invalidation levels that were routinely hit and then reversed. A recurring pattern of execution outside the plan. These are the things to investigate across the sample. A single instance of any of them is a Tuesday.
        </InfoBox>
      </StepCard>

      <StepCard step="Step 5" title="Change one variable" color={OR}>
        Once the sample reveals a repeatable pattern, identify one variable to test in the next sample. Keeping the rest of the plan consistent makes it easier to evaluate the effect of that change.
        <RuleBox color={OR} rule="Test one change at a time when practical. Write the change and the reason on the planner before the next trade, then evaluate it across another sample of comparable trades."/>
        <InfoBox icon="🧮" label="Example" bg="#e8faf3" green>
          Across a sample of swing trades, your trailing stop repeatedly triggered on ordinary pullbacks, and price often went on to hit the target. That suggests the trail may be too tight for the daily timeframe. Test one change: trail below the prior two days' low instead of one. Keep the rest of the plan consistent, then evaluate the change across another comparable sample.
        </InfoBox>
      </StepCard>

      <AskYourself
        color={OR}
        question="Am I changing this rule because of a pattern in the journal, or because of the trade that just closed?"
        noLabel="Trade"
        no="Do not change it based on one trade. Log the trade, note the urge, and continue collecting comparable trades under the current plan."
        yesLabel="Pattern"
        yes="Define one change to test, write down the reason, and carry it into your next Module 5 plan."
      />

      <PathSwitch current={4} goTab={goTab}/>
      <Resources items={TOOLS}/>
      <ChecklistBridge/>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════════════
const TABS=[
  {label:"Process",  icon:"🧭"},
  {label:"Winner",   icon:"📈"},
  {label:"Loser",    icon:"📉"},
  {label:"Stay",     icon:"⏸️"},

];

  return(

        <span style={{fontFamily:"Georgia,serif",fontStyle:"italic",fontSize:"1.2rem",color:"#fff"}}>demystified</span>
        <a href="https://options101-hub.vercel.app/"
          style={{display:"flex",alignItems:"center",gap:"6px",background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.14)",borderRadius:"999px",padding:"5px 14px",textDecoration:"none"}}
          onMouseOver={e=>e.currentTarget.style.background="rgba(255,255,255,0.15)"}
          onMouseOut={e=>e.currentTarget.style.background="rgba(255,255,255,0.08)"}>
          <span style={{color:"#d4a87a",fontSize:"0.8rem"}}>←</span>
          <span style={{fontSize:"0.65rem",fontWeight:"700",letterSpacing:"0.1em",textTransform:"uppercase",color:"#d4a87a"}}>Options 101 Hub</span>
        </a>
        <div style={{width:"22px",height:"22px",background:OR,borderRadius:"5px"}}/>
      </div>

      <div style={{maxWidth:"860px",margin:"0 auto",padding:"22px 16px 40px"}}>
        <div style={{marginBottom:"14px"}}>
          <div style={{fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.14em",textTransform:"uppercase",color:"#8a7560",marginBottom:"6px"}}>Module 6</div>
          <h1 style={{fontFamily:"Georgia,serif",fontSize:"clamp(1.7rem,4vw,2.3rem)",color:DK,letterSpacing:"-0.03em",lineHeight:"1.15",marginBottom:"4px"}}>Trade Management</h1>
          <p style={{color:"#8a7560",fontSize:"0.85rem"}}>From fill to exit.</p>
        </div>

        <div style={{display:"flex",gap:"2px",background:"#e4d8c8",borderRadius:"12px",padding:"3px",marginBottom:"10px"}}>
          {TABS.map((t,i)=>(
            <button key={i} onClick={()=>goTab(i)} style={{
              flex:1,padding:"9px 2px",border:"none",borderRadius:"9px",cursor:"pointer",
              fontWeight:"700",fontSize:"0.58rem",letterSpacing:"0.01em",transition:"all 0.18s",
              background:tab===i?"#fff":"transparent",
              color:tab===i?OR:"#8a7560",
              boxShadow:tab===i?"0 1px 6px rgba(0,0,0,0.09)":"none",lineHeight:"1.3"}}>
              <div style={{fontSize:"0.85rem"}}>{t.icon}</div>
              <div style={{marginTop:"2px"}}>{t.label}</div>
            </button>
          ))}
        </div>

        <div style={{height:"3px",background:"#e4d8c8",borderRadius:"2px",marginBottom:"20px"}}>
          <div style={{height:"100%",width:((tab/(TABS.length-1))*100)+"%",background:OR,borderRadius:"2px",transition:"width 0.4s ease"}}/>
        </div>

        {tab===0&&<TabProcess goTab={goTab}/>}
        {tab===1&&<TabWinner  goTab={goTab}/>}
        {tab===2&&<TabLoser   goTab={goTab}/>}
        {tab===3&&<TabStay    goTab={goTab}/>}
        {tab===4&&<TabExecute goTab={goTab}/>}

        <div style={{marginTop:"24px",textAlign:"center",fontSize:"0.65rem",color:"#b0a090",letterSpacing:"0.05em"}}>
          <span style={{fontFamily:"Georgia,serif",fontStyle:"italic"}}>demystified</span> · For educational purposes only
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
